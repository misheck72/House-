<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyumba — Zambia's Property Marketplace</title>
<meta name="description" content="Find houses, apartments, land, farms and commercial property for sale and to let across Zambia. Prices in ZMW and USD.">
<meta name="theme-color" content="#0b6b4f">
<style>
/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --green:#0b6b4f;
  --green-600:#0e7d5c;
  --green-50:#e8f3ee;
  --green-100:#d3e9df;
  --copper:#c8763c;
  --amber:#f2a03d;
  --ink:#0e1a14;
  --muted:#6a7a72;
  --line:#e3e8e5;
  --bg:#f7f8f6;
  --card:#fff;
  --radius:14px;
  --shadow:0 1px 2px rgba(14,26,20,.05), 0 8px 24px rgba(14,26,20,.06);
  --maxw:1140px;
  --safe: env(safe-area-inset-bottom, 0px);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 14px}
#app{padding-bottom:calc(88px + var(--safe))}
@media(min-width:860px){#app{padding-bottom:40px}}

/* ============================================================
   HEADER
   ============================================================ */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:var(--maxw);margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.02em;flex-shrink:0}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0b6b4f,#16a172);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;box-shadow:0 2px 8px rgba(11,107,79,.28)}
.logo small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;line-height:1}
.nav{display:none;gap:2px;margin-left:10px}
.nav a{padding:8px 11px;border-radius:9px;font-size:13.5px;font-weight:600;color:#3d4c45}
.nav a:hover{background:var(--green-50);color:var(--green)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
@media(min-width:860px){.nav{display:flex}}

.cur-toggle{display:flex;background:#eef1ef;border-radius:999px;padding:3px;font-size:12px;font-weight:700}
.cur-toggle button{padding:5px 9px;border-radius:999px;color:var(--muted);transition:.15s}
.cur-toggle button.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.13)}

/* ============================================================
   BUTTONS / CHIPS
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 2px 10px rgba(11,107,79,.25)}
.btn-primary:hover{background:var(--green-600)}
.btn-outline{border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.btn-outline:hover{border-color:var(--green-100);background:var(--green-50)}
.btn-ghost{background:var(--green-50);color:var(--green)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.btn-wa{background:#25D366;color:#fff}
.btn-call{background:#0b6b4f;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff}
.icon-btn svg{width:18px;height:18px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:#3d4c45;white-space:nowrap;transition:.14s}
.chip:hover{border-color:var(--green-100)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* ============================================================
   HERO
   ============================================================ */
.hero{background:linear-gradient(160deg,#0b6b4f 0%,#0e8a63 55%,#14a173 100%);color:#fff;padding:26px 0 32px;border-radius:0 0 24px 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(700px 240px at 88% -20%,rgba(255,255,255,.2),transparent 70%);pointer-events:none}
.hero h1{font-size:25px;line-height:1.16;letter-spacing:-.03em;font-weight:800;margin-bottom:7px}
.hero p{font-size:13.5px;opacity:.9;margin-bottom:16px;max-width:440px}
@media(min-width:700px){.hero h1{font-size:34px}.hero{padding:44px 0 46px}}

.seg{display:flex;background:rgba(255,255,255,.16);border-radius:11px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.82);transition:.14s}
.seg button.on{background:#fff;color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.16)}
.seg.dark{background:#eef1ef;margin-bottom:0}
.seg.dark button{color:var(--muted)}
.seg.dark button.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.13)}

.searchbox{background:#fff;border-radius:14px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:8px}
.searchbox .row{display:flex;gap:8px}
.searchbox input{flex:1;min-width:0;border:0;background:#f3f5f4;border-radius:10px;padding:12px 13px;font-size:14px;outline:none}
.searchbox input:focus{background:#fff;box-shadow:0 0 0 2px var(--green-100)}
.searchbox .btn{flex-shrink:0}

/* ============================================================
   SECTIONS
   ============================================================ */
.section{padding:22px 0}
.section-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:13px}
.section-hd h2{font-size:17.5px;font-weight:800;letter-spacing:-.02em}
.section-hd p{font-size:12.5px;color:var(--muted);margin-top:2px}
.section-hd a{font-size:13px;font-weight:700;color:var(--green);flex-shrink:0}

/* ============================================================
   CARDS
   ============================================================ */
.grid{display:grid;gap:13px;grid-template-columns:1fr}
@media(min-width:540px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:880px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
.grid.two{grid-template-columns:1fr}
@media(min-width:540px){.grid.two{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);display:block;transition:transform .15s, box-shadow .15s;position:relative}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card:active{transform:scale(.992)}
.card-media{position:relative;aspect-ratio:4/3;background:#e7ece9;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .card-media img{transform:scale(1.04)}
.card-badges{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:75%}
.badge{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:4px 7px;border-radius:6px;color:#fff;backdrop-filter:blur(4px)}
.badge.feat{background:linear-gradient(135deg,#f2a03d,#e0851f)}
.badge.exc{background:linear-gradient(135deg,#1c1c1c,#3d3d3d)}
.badge.ver{background:linear-gradient(135deg,#0b6b4f,#14a173)}
.badge.new{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.fav-btn{position:absolute;top:8px;right:8px;width:33px;height:33px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.16);transition:.15s}
.fav-btn svg{width:17px;height:17px;stroke:#3d4c45;fill:none;stroke-width:2}
.fav-btn.on svg{fill:#e0245e;stroke:#e0245e}
.fav-btn.on{transform:scale(1.06)}
.card-body{padding:10px 12px 12px}
.card-price{font-size:16.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.card-price span{font-size:11.5px;font-weight:600;color:var(--muted)}
.card-title{font-size:13.5px;font-weight:600;margin-top:3px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#1c2a23}
.card-meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card-meta b{color:#3d4c45;font-weight:700}
.card-loc{font-size:12px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:4px}
.card-loc svg{width:12px;height:12px;flex-shrink:0;stroke:var(--muted)}

/* ============================================================
   QUICK LINKS / TILES
   ============================================================ */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 12px;display:flex;flex-direction:column;gap:5px;transition:.15s}
.tile:hover{border-color:var(--green-100);background:var(--green-50)}
.tile svg{width:22px;height:22px;stroke:var(--green);fill:none;stroke-width:1.7}
.tile b{font-size:13px;font-weight:700}
.tile small{font-size:11.5px;color:var(--muted)}

.area-card{position:relative;border-radius:13px;overflow:hidden;aspect-ratio:16/10;background:#dfe7e2}
.area-card img{width:100%;height:100%;object-fit:cover}
.area-card .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.05) 55%)}
.area-card .txt{position:absolute;left:12px;right:12px;bottom:11px;color:#fff}
.area-card .txt b{font-size:14.5px;font-weight:800;display:block}
.area-card .txt small{font-size:11.5px;opacity:.88}

/* ============================================================
   BANNERS
   ============================================================ */
.warn{background:#fff8ec;border:1px solid #f5dfb8;border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#7a5316;line-height:1.4}
.warn svg{width:18px;height:18px;flex-shrink:0;stroke:#c8763c;fill:none;stroke-width:1.9;margin-top:1px}
.warn b{display:block;color:#5c3d0e;margin-bottom:1px}

/* ============================================================
   SEARCH PAGE
   ============================================================ */
.search-head{background:#fff;border-bottom:1px solid var(--line);padding:11px 0 10px;position:sticky;top:53px;z-index:40}
.searchbar{position:relative}
.searchbar input{width:100%;border:1.5px solid var(--line);background:#f7f8f6;border-radius:11px;padding:11px 13px 11px 38px;font-size:14px;outline:none;transition:.15s}
.searchbar input:focus{background:#fff;border-color:var(--green);box-shadow:0 0 0 3px var(--green-50)}
.searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.toolbar{display:flex;align-items:center;gap:8px;margin-top:9px}
.toolbar .spacer{flex:1}
.toolbar select{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600;outline:none;max-width:150px}
.filter-count{background:var(--green);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px;margin-left:5px;font-weight:800}
.result-count{font-size:12.5px;color:var(--muted);padding:13px 0 9px}
.result-count b{color:var(--ink)}

/* ============================================================
   SHEET (filters)
   ============================================================ */
.sheet{position:fixed;inset:0;z-index:90;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(14,26,20,.45);backdrop-filter:blur(2px)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:700px){
  .sheet-panel{left:50%;transform:translateX(-50%);bottom:auto;top:50%;margin-top:-330px;width:600px;border-radius:18px;max-height:78vh}
  @keyframes slideUp{from{opacity:0}to{opacity:1}}
}
.sheet-hd{padding:15px 16px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sheet-hd h3{font-size:16px;font-weight:800;flex:1}
.sheet-body{padding:15px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-ft{padding:12px 16px calc(12px + var(--safe));border-top:1px solid var(--line);display:flex;gap:9px;flex-shrink:0}
.fgroup{margin-bottom:19px}
.fgroup>label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:9px}
.frow{display:flex;gap:9px}
.frow>*{flex:1;min-width:0}

/* ============================================================
   FORMS
   ============================================================ */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:#3d4c45}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.input,.select,.textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:14px;outline:none;transition:.15s;-webkit-appearance:none;appearance:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-50)}
.textarea{resize:vertical;min-height:92px;line-height:1.5}
.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236a7a72' stroke-width='2.4' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.input-group{display:flex}
.input-group .input{border-radius:10px 0 0 10px}
.input-group .select{width:88px;flex-shrink:0;border-radius:0 10px 10px 0;border-left:0}
.err{color:#c0392b;font-size:12px;margin-top:6px;font-weight:600}

/* ============================================================
   LISTING DETAIL
   ============================================================ */
.gallery{position:relative;background:#0e1a14}
.g-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.g-track::-webkit-scrollbar{display:none}
.g-slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;background:#dfe7e2}
.g-slide img{width:100%;height:100%;object-fit:cover}
@media(min-width:800px){.g-slide{aspect-ratio:16/9}}
.g-count{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.62);color:#fff;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;backdrop-filter:blur(4px)}
.g-back{position:absolute;left:10px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.g-back svg{width:18px;height:18px;stroke:#0e1a14;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.detail-head{background:#fff;padding:15px 14px;border-bottom:1px solid var(--line)}
.detail-price{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.detail-price-alt{font-size:13px;color:var(--muted);font-weight:600;margin-top:3px}
.detail-title{font-size:16px;font-weight:700;margin-top:9px;line-height:1.3;letter-spacing:-.01em}
.detail-loc{font-size:13px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
.detail-loc svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.9}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
@media(min-width:540px){.kv{grid-template-columns:repeat(4,1fr)}}
.kv-cell{background:#fff;padding:12px 12px}
.kv-cell span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kv-cell b{display:block;font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.01em}

.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 14px;margin-bottom:13px}
.panel h3{font-size:14.5px;font-weight:800;margin-bottom:11px;letter-spacing:-.01em}
.panel p{font-size:13.5px;color:#3d4c45;line-height:1.6;white-space:pre-line}
.amenities{display:flex;flex-wrap:wrap;gap:7px}
.amenity{font-size:12.5px;font-weight:600;background:var(--green-50);color:#0a5a43;padding:6px 11px;border-radius:8px;display:flex;align-items:center;gap:5px}
.amenity svg{width:13px;height:13px;stroke:var(--green);fill:none;stroke-width:2.6}

.spec-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f3f1;font-size:13.5px}
.spec-row:last-child{border-bottom:0}
.spec-row span{color:var(--muted)}
.spec-row b{font-weight:700}

.map-box{position:relative;border-radius:12px;overflow:hidden;height:190px;background:linear-gradient(135deg,#e8efe9,#d6e4db);border:1px solid var(--line)}
.map-box .pin-big{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);width:34px;height:34px;background:var(--green);border-radius:50% 50% 50% 0;rotate:-45deg;display:grid;place-items:center;box-shadow:0 4px 12px rgba(11,107,79,.4)}
.map-box .pin-big::after{content:"";width:11px;height:11px;background:#fff;border-radius:50%}
.map-box .map-label{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(255,255,255,.95) 40%);padding:22px 12px 10px;font-size:12px;color:var(--muted)}

.agent-card{display:flex;gap:12px;align-items:flex-start}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#0b6b4f,#16a172);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex-shrink:0}
.agent-card .info{flex:1;min-width:0}
.agent-card .name{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.agent-card .agency{font-size:12.5px;color:var(--muted);margin-top:1px}
.verified-tick{display:inline-flex;align-items:center;gap:3px;background:var(--green-50);color:var(--green);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.verified-tick svg{width:11px;height:11px;stroke:var(--green);fill:none;stroke-width:3}
.license{font-size:11.5px;color:var(--muted);margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.contact-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.contact-bar .btn{padding:12px 10px;font-size:13.5px}
.contact-bar .full{grid-column:1/-1}

.share-row{display:flex;gap:8px;margin-top:12px}
.share-row .btn{flex:1;font-size:12.5px;padding:10px 8px}
.share-row .btn svg{width:16px;height:16px}

/* ============================================================
   POST FLOW
   ============================================================ */
.stepper{background:#fff;border-bottom:1px solid var(--line);padding:12px 0 13px;position:sticky;top:53px;z-index:40}
.steps{display:flex;gap:5px}
.step-dot{flex:1;height:4px;border-radius:2px;background:#e3e8e5;transition:.25s}
.step-dot.done{background:var(--green)}
.step-dot.current{background:var(--green);box-shadow:0 0 0 3px var(--green-50)}
.step-label{font-size:12px;font-weight:700;color:var(--muted);margin-top:9px;display:flex;justify-content:space-between}
.step-label b{color:var(--green)}

.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.type-grid{grid-template-columns:repeat(3,1fr)}}
.type-opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:15px 12px;text-align:left;transition:.14s;display:flex;flex-direction:column;gap:7px}
.type-opt svg{width:24px;height:24px;stroke:#3d4c45;fill:none;stroke-width:1.6}
.type-opt b{font-size:13.5px;font-weight:700}
.type-opt.on{border-color:var(--green);background:var(--green-50)}
.type-opt.on svg{stroke:var(--green)}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:540px){.photo-grid{grid-template-columns:repeat(4,1fr)}}
.photo-slot{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eef1ef;border:1.5px dashed var(--line);display:grid;place-items:center;cursor:pointer}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.photo-slot .rm{position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;font-size:13px;line-height:1;font-weight:700}
.photo-slot .cover-tag{position:absolute;bottom:0;left:0;right:0;background:rgba(11,107,79,.9);color:#fff;font-size:9px;font-weight:800;text-align:center;padding:2px;letter-spacing:.05em}
.photo-slot.dragging{opacity:.4}
.photo-add{border:1.5px dashed var(--green-100);background:var(--green-50);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;text-align:center;color:var(--green);font-size:11.5px;font-weight:700;padding:6px}

/* ============================================================
   TABBAR
   ============================================================ */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:10px;font-weight:700;color:var(--muted);transition:.14s}
.tabbar a.on{color:var(--green)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:860px){.tabbar{display:none}}

/* ============================================================
   MODAL / TOAST
   ============================================================ */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(14,26,20,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);animation:fadeIn .16s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:#fff;width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + var(--safe));max-height:92vh;overflow-y:auto;animation:slideUp .2s ease}
@media(min-width:640px){.modal{border-radius:18px;padding-bottom:20px;animation:fadeIn .18s}}
.modal h3{font-size:17px;font-weight:800;margin-bottom:5px;letter-spacing:-.02em}
.modal .sub{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.45}

#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe));transform:translate(-50%,20px);background:#0e1a14;color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;z-index:200;opacity:0;pointer-events:none;transition:.24s;box-shadow:0 6px 24px rgba(0,0,0,.28);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   MISC
   ============================================================ */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;stroke:#c3d0c8;fill:none;stroke-width:1.5;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty p{font-size:13px;max-width:280px;margin:0 auto}
.skeleton{background:linear-gradient(90deg,#eef1ef 25%,#e3e8e5 50%,#eef1ef 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.divider{height:1px;background:var(--line);margin:14px 0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--green-50);border-radius:10px;padding:11px 9px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:800;color:var(--green);letter-spacing:-.02em}
.stat span{font-size:10.5px;color:#4a6b5c;font-weight:600;text-transform:uppercase;letter-spacing:.03em}

.map-canvas{position:relative;height:calc(100vh - 210px);min-height:380px;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,#eaf1ec,#d9e6dd);border:1px solid var(--line)}
.map-canvas .zambia{position:absolute;inset:0;opacity:.5}
.pin{position:absolute;transform:translate(-50%,-100%);background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;box-shadow:0 3px 10px rgba(11,107,79,.4);white-space:nowrap;transition:.15s}
.pin:hover{background:#0e8a63;transform:translate(-50%,-100%) scale(1.08);z-index:5}
.pin.feat{background:var(--copper)}
</style>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RATE = 27.5; // ZMW per USD (indicative)

const toZMW  = (a, cur) => cur === 'USD' ? a * RATE : a;
const fromZMW = (z, cur) => cur === 'USD' ? z / RATE : z;

function fmtMoney(v, cur) {
  const sym = cur === 'ZMW' ? 'K' : '$';
  if (v >= 1e6) {
    const m = v / 1e6;
    return sym + (m >= 10 ? m.toFixed(1) : m.toFixed(2)).replace(/\.?0+$/, '') + 'M';
  }
  return sym + Math.round(v).toLocaleString('en-US');
}
function fmtExact(v, cur) {
  const sym = cur === 'ZMW' ? 'K' : 'US$';
  return sym + Math.round(v).toLocaleString('en-US');
}
function priceSuffix(l) {
  return l.purpose === 'rent' ? ' /month' : l.purpose === 'short' ? ' /night' : '';
}
function priceText(l, cur) {
  return fmtMoney(fromZMW(toZMW(l.price, l.currency), cur), cur) + priceSuffix(l);
}
function priceExact(l, cur) {
  return fmtExact(fromZMW(toZMW(l.price, l.currency), cur), cur);
}
function altPrice(l, cur) {
  const other = cur === 'ZMW' ? 'USD' : 'ZMW';
  return '≈ ' + fmtExact(fromZMW(toZMW(l.price, l.currency), other), other) + priceSuffix(l);

/* ============================================================
   3. ROUTER
   ============================================================ */
function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  return { path: path || '/', params: new URLSearchParams(qs || '') };
}

function seedFiltersFromParams(p) {
  const f = defaultFilters();
  let seeded = false;
  const set = (k, v) => { if (v != null && v !== '') { f[k] = v; seeded = true; } };
  set('q', p.get('q'));
  set('purpose', p.get('purpose'));
  set('type', p.get('type'));
  set('province', p.get('province'));
  set('city', p.get('city'));
  set('sort', p.get('sort'));
  if (seeded) state.filters = f;
}

function navigate(hash) { location.hash = hash; }

function route() {
  const { path, params } = parseHash();
  const app = $('#app');
  window.scrollTo(0, 0);

  if (path === '/' || path === '') {
    document.title = "Nyumba — Zambia's Property Marketplace";
    app.innerHTML = homeView();
    bindHome();
  } else if (path === '/search') {
    seedFiltersFromParams(params);
    document.title = 'Search property in Zambia — Nyumba';
    app.innerHTML = searchView();
    bindSearch();
  } else if (path.startsWith('/property/')) {
    const ref = decodeURIComponent(path.split('/')[2] || '');
    const listing = byRef[ref];
    if (!listing) { app.innerHTML = notFoundView(); }
    else {
      document.title = `${listing.title} — ${priceExact(listing, 'ZMW')} | Nyumba Zambia`;
      const meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute('content', listing.desc.slice(0, 155));
      app.innerHTML = detailView(listing);
      bindDetail(listing);
    }
  } else if (path === '/post') {
    document.title = 'Post a property — Nyumba';
    app.innerHTML = postView();
    bindPost();
  } else if (path === '/saved') {
    document.title = 'Saved properties — Nyumba';
    app.innerHTML = savedView();
  } else if (path === '/account') {
    document.title = 'My account — Nyumba';
    app.innerHTML = accountView();
  } else if (path === '/advice') {
    document.title = 'Property advice & guides — Nyumba';
    app.innerHTML = adviceView();
  } else if (path === '/agents') {
    document.title = 'Estate agents in Zambia — Nyumba';
    app.innerHTML = agentsView();
  } else {
    app.innerHTML = notFoundView();
  }

  updateChrome(path);
}

function updateChrome(path) {
  $$('#tabbar a').forEach(a => {
    const tab = a.dataset.tab;
    a.classList.toggle('on', tab === path || (tab === '/search' && path.startsWith('/property')));
  });
  $$('#curToggle button').forEach(b => b.classList.toggle('on', b.dataset.val === state.currency));
  const hp = $('#hdrPost');
  if (hp) hp.style.display = window.innerWidth >= 860 ? 'inline-flex' : 'none';
  const postTab = $('#tabbar a[data-tab="/post"]');
  if (postTab) postTab.classList.toggle('on', path === '/post');
}

window.addEventListener('hashchange', route);
window.addEventListener('resize', () => updateChrome(parseHash().path));

function toast(msg) {

}

function badgeHTML(kind) {
  const map = {
    featured:['Featured','feat'],
    exclusive:['Exclusive','exc'],
    verified:['Verified','ver'],
    new:['New','new']
  };
  const m = map[kind];
  return m ? `<span class="badge ${m[1]}">${m[0]}</span>` : '';
}

function cardBadges(l) {
  const out = [];
  if (l.featured) out.push('featured');
  if ((l.badges || []).includes('Exclusive')) out.push('exclusive');
  const a = AGENTS[l.agent];
  if (a && a.verified) out.push('verified');
  if (l.daysAgo <= 3) out.push('new');
  return out.slice(0, 2).map(badgeHTML).join('');
}

function typeLabel(t) {
  return ({ house:'House', apartment:'Apartment', townhouse:'Townhouse', commercial:'Commercial',
            industrial:'Industrial', farm:'Farm', land:'Vacant land' })[t] || t;
}
function purposeLabel(p) {
  return ({ sale:'For sale', rent:'To let', short:'Short stay' })[p] || p;
}

function cardHTML(l) {
  const isFav = state.favourites.has(l.id);
  const metaBits = [];
  if (l.beds) metaBits.push(`<b>${l.beds}</b> bed${l.beds > 1 ? 's' : ''}`);
  if (l.baths) metaBits.push(`<b>${l.baths}</b> bath${l.baths > 1 ? 's' : ''}`);
  if (l.plot) metaBits.push(`<b>${l.plot.toLocaleString('en-US')}</b> ${l.plotUnit}`);

  return `
  <a class="card" href="#/property/${encodeURIComponent(l.ref)}">
    <div class="card-media">
      <img src="${imgUrl(l.photos[0], 520)}" alt="${esc(l.title)}"
           loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${FALLBACK}'">
      <div class="card-badges">${cardBadges(l)}</div>
      <button class="fav-btn ${isFav ? 'on' : ''}" data-act="fav" data-id="${l.id}" aria-label="Save property">
        ${icon('heart')}

    <div class="card-body">
      <div class="card-price">${priceText(l, state.currency)}</div>
      <div class="card-title">${esc(l.title)}</div>
      <div class="card-meta">${metaBits.join('<span style="color:#cbd5d0">·</span>') || '<span>' + typeLabel(l.type) + '</span>'}</div>

    </div>
  </a>`;
}

function applyFilters(list) {
  const f = state.filters;
  let out = list.filter(l => {
    if (f.purpose && l.purpose !== f.purpose) return false;
    if (f.type && l.type !== f.type) return false;
    if (f.province && l.province !== f.province) return false;
    if (f.city && l.city !== f.city) return false;
    if (f.beds && (l.beds || 0) < f.beds) return false;
    if (f.baths && (l.baths || 0) < f.baths) return false;
    if (f.minPlot) {
      const sqm = l.plotUnit === 'ha' ? l.plot * 10000 : l.plot;
      if (sqm < f.minPlot) return false;
    }
    const z = toZMW(l.price, l.currency);
    if (f.minZ != null && z < f.minZ) return false;
    if (f.maxZ != null && z > f.maxZ) return false;
    if (f.amenities.length && !f.amenities.every(a => (l.amenities || []).includes(a))) return false;
    if (f.power.length && !f.power.some(p => (l.power || []).includes(p))) return false;
    if (f.water.length && !f.water.some(w => (l.water || []).includes(w))) return false;
    if (f.q) {
      const hay = [l.title, l.suburb, l.city, l.province, l.ref, l.desc, typeLabel(l.type)].join(' ').toLowerCase();
      if (!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  });

  const price = l => toZMW(l.price, l.currency);
  const size  = l => l.plotUnit === 'ha' ? l.plot * 10000 : l.plot;
  if (f.sort === 'newest') out.sort((a, b) => a.daysAgo - b.daysAgo);
  if (f.sort === 'price-asc') out.sort((a, b) => price(a) - price(b));
  if (f.sort === 'price-desc') out.sort((a, b) => price(b) - price(a));
  if (f.sort === 'size-desc') out.sort((a, b) => size(b) - size(a));
  return out;
}

function activeFilterCount() {
  const f = state.filters;
  let n = 0;
  if (f.purpose) n++;
  if (f.type) n++;
  if (f.province) n++;
  if (f.city) n++;
  if (f.minZ != null || f.maxZ != null) n++;
  if (f.beds) n++;
  if (f.baths) n++;
  if (f.minPlot) n++;
  n += f.amenities.length + f.power.length + f.water.length;
  return n;
}

/* Rough Zambia outline for the map placeholder */
function toXY(lng, lat) {
  return [((lng - 22) / 12) * 100, ((-8 - lat) / 10) * 100];
}
function zambiaPath() {
  const pts = [[22.0,-13.0],[25.5,-11.2],[29.0,-8.5],[31.5,-8.6],[33.0,-9.7],[33.7,-12.0],
               [33.0,-14.0],[32.0,-16.0],[30.4,-15.6],[30.0,-14.5],[29.7,-13.5],[28.5,-12.3],
               [27.0,-12.0],[25.5,-13.0],[24.0,-13.0],[22.0,-13.0]];
  return pts.map((p, i) => {
    const [x, y] = toXY(p[0], p[1]);
    return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ') + ' Z';
}

function bindSearch() {
  const q = $('#searchQ');

  q.addEventListener('input', () => {
    state.filters.q = q.value;
    clearTimeout(t);
    t = setTimeout(refreshResults, 220);
  });
  $('#sortSel').addEventListener('change', e => {
    state.filters.sort = e.target.value;
    refreshResults();
  });

  const minEl = $('#fMin'), maxEl = $('#fMax');
  const readPrices = () => {
    const cur = state.currency;
    const mi = parseFloat(minEl?.value), ma = parseFloat(maxEl?.value);
    state.filters.minZ = isFinite(mi) && mi > 0 ? toZMW(mi, cur) : null;
    state.filters.maxZ = isFinite(ma) && ma > 0 ? toZMW(ma, cur) : null;
    refreshResults();
  };
  if (minEl) minEl.addEventListener('change', readPrices);
  if (maxEl) maxEl.addEventListener('change', readPrices);

  $$('[data-act="f-select"]').forEach(sel => {
    sel.addEventListener('change', () => {
      const g = sel.dataset.group;
      state.filters[g] = g === 'minPlot' ? Number(sel.value) : sel.value;
      if (g === 'province') state.filters.city = '';
      refreshResults();
      // Rebuild the sheet to reflect dependent city list
      const sheet = $('#filterSheet');
      if (sheet) {
        const wasOpen = sheet.classList.contains('open');
        sheet.outerHTML = filterSheetHTML();
        bindSheet();
        if (wasOpen) $('#filterSheet').classList.add('open');
      }
    });
  });
}

function bindPost() {
  if (!state.user) {
    // sign-in handlers are global
    return;
  }
  // file input
  const input = $('#photoInput');
  if (input) {
    input.addEventListener('change', e => {
      const files = Array.from(e.target.files || []).slice(0, 15 - state.draft.photos.length);
      files.forEach(f => {
        const url = URL.createObjectURL(f);
        state.draft.photos.push(url);
      });
      saveDraft();
      rerenderStep();
    });
  }
  // drag to reorder
  const grid = $('#photoGrid');
  if (grid) {
    let dragIdx = null;
    grid.addEventListener('dragstart', e => {
      const slot = e.target.closest('.photo-slot');
      if (!slot) return;
      dragIdx = Number(slot.dataset.idx);
      slot.classList.add('dragging');
    });
    grid.addEventListener('dragend', e => {
      const slot = e.target.closest('.photo-slot');
      if (slot) slot.classList.remove('dragging');
    });
    grid.addEventListener('dragover', e => e.preventDefault());
    grid.addEventListener('drop', e => {
      e.preventDefault();
      const slot = e.target.closest('.photo-slot');
      if (!slot || dragIdx === null) return;
      const to = Number(slot.dataset.idx);
      if (to === dragIdx) return;
      const arr = state.draft.photos;
      const [moved] = arr.splice(dragIdx, 1);
      arr.splice(to, 0, moved);
      dragIdx = null;
      saveDraft();
      rerenderStep();
    });
  }
}

function saveDraft() {
  localStorage.setItem('nz_draft', JSON.stringify(state.draft));
}
function rerenderStep() {
  const body = $('#stepBody');
  if (body) body.innerHTML = stepBodyHTML(state.postStep, state.draft);
  bindPost();
}

function validateStep(step) {
  const d = state.draft;
  if (step === 1) {
    if (!d.purpose) return 'Choose whether the property is for sale, to let or short stay.';
    if (!d.type) return 'Select a property type.';
  }
  if (step === 2) {
    if (!d.province) return 'Select a province.';
    if (!d.city) return 'Select a city or town.';
    if (!d.suburb.trim()) return 'Enter the suburb or area.';
  }
  if (step === 3) {
    if (!d.title.trim() || d.title.trim().length < 10) return 'Enter a listing title of at least 10 characters.';
    if (!d.price || Number(d.price) <= 0) return 'Enter a valid price.';
    if (!d.desc.trim() || d.desc.trim().length < 30) return 'Please write a description of at least 30 characters.';
  }
  if (step === 4) {
    if (!d.titleType) return 'Select the title type.';
  }
  if (step === 5) {
    if (d.photos.length < 1) return 'Add at least one photo.';
  }
  return null;
}

/* ============================================================
   12. GLOBAL EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  /* --- currency --- */
  if (act === 'cur') {
    state.currency = el.dataset.val;
    localStorage.setItem('nz_cur', state.currency);
    $$('#curToggle button').forEach(b => b.classList.toggle('on', b.dataset.val === state.currency));
    route();
    return;
  }

  /* --- favourites --- */
  if (act === 'fav') {
    e.preventDefault();
    e.stopPropagation();
    const id = el.dataset.id;
    if (state.favourites.has(id)) {
      state.favourites.delete(id);
      toast('Removed from saved');
    } else {
      state.favourites.add(id);
      toast('Saved to your properties');
    }
    localStorage.setItem('nz_favs', JSON.stringify([...state.favourites]));
    el.classList.toggle('on');
    if (el.classList.contains('fav-btn')) {
      const on = state.favourites.has(id);
      el.innerHTML = `<svg viewBox="0 0 24 24" fill="${on ? '#e0245e' : 'none'}" stroke="${on ? '#e0245e' : '#3d4c45'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 20s-7-4.4-7-9.3A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.7C19 15.6 12 20 12 20Z"/></svg>`;
    } else if (el.classList.contains('icon-btn')) {
      const on = state.favourites.has(id);
      el.querySelector('svg').setAttribute('fill', on ? '#e0245e' : 'none');
      el.querySelector('svg').setAttribute('stroke', on ? '#e0245e' : '#3d4c45');
    }
    if (parseHash().path === '/saved') route();
    return;
  }

  /* --- filters sheet --- */
  if (act === 'open-filters') {
    const s = $('#filterSheet');
    if (s) s.classList.add('open');
    document.body.style.overflow = 'hidden';
    return;
  }
  if (act === 'close-filters') {
    const s = $('#filterSheet');
    if (s) s.classList.remove('open');
    document.body.style.overflow = '';
    return;
  }
  if (act === 'clear-filters') {
    state.filters = defaultFilters();
    route();
    toast('Filters cleared');
    return;
  }
  if (act === 'f-chip') {
    const g = el.dataset.group, v = el.dataset.val;
    const f = state.filters;
    if (g === 'purpose' || g === 'type') {
      f[g] = v;
      $$(`#filterSheet [data-group="${g}"] .chip`).forEach(c => c.classList.toggle('on', c.dataset.val === v));
    } else if (g === 'beds' || g === 'baths') {
      f[g] = Number(v);
      $$(`#filterSheet [data-group="${g}"] .chip`).forEach(c => c.classList.toggle('on', Number(c.dataset.val) === f[g]));
    } else {
      const arr = f[g];
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else arr.push(v);
      el.classList.toggle('on');
    }
    refreshResults();
    return;
  }
  if (act === 'view') {
    state.view = el.dataset.v;
    $$('[data-act="view"]').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
    refreshResults();
    return;
  }

  /* --- detail actions --- */
  if (act === 'back') { history.length > 1 ? history.back() : navigate('#/'); return; }
  if (act === 'lightbox') {
    const l = byRef[decodeURIComponent(parseHash().path.split('/')[2] || '')];
    if (l) lightboxModal(l, Number(el.dataset.i));
    return;
  }
  if (act === 'copy') {
    const url = el.dataset.url;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(() => toast('Link copied to clipboard')).catch(() => toast('Copy failed'));
    } else {
      toast('Link copied');
    }
    return;
  }
  if (act === 'enquiry') { const l = byId[el.dataset.id]; if (l) enquiryModal(l); return; }
  if (act === 'viewing') { const l = byId[el.dataset.id]; if (l) viewingModal(l); return; }
  if (act === 'report') { const l = byId[el.dataset.id]; if (l) reportModal(l); return; }
  if (act === 'valuation') { valuationModal(); return; }
  if (act === 'send-enquiry') { closeModal(); toast('Enquiry sent — the agent will contact you shortly'); return; }
  if (act === 'send-viewing') {
    const dt = $('#viewDate')?.value;
    if (!dt) { toast('Please choose a date'); return; }
    closeModal();
    toast('Viewing request sent for ' + dt);
    return;
  }
  if (act === 'send-report') { closeModal(); toast('Report submitted — thank you, our team will review it'); return; }
  if (act === 'send-valuation') { closeModal(); toast('Valuation request sent — an agent will be in touch'); return; }

  /* --- modals --- */
  if (act === 'close-modal') { closeModal(); return; }

  /* --- auth --- */
  if (act === 'open-signin' || act === 'send-otp') {
    const phone = ($('#signPhone')?.value || $('#signPhone') || '').trim?.() || '';
    const val = $('#signPhone') ? $('#signPhone').value.trim() : '';
    if (act === 'send-otp' && val.length < 7) { toast('Enter a valid phone number'); return; }
    otpModal('+260 ' + val.replace(/^0/, ''));
    return;
  }
  if (act === 'verify-otp') {
    const code = $('#otpCode')?.value.trim();
    if (code !== '123456') { toast('Incorrect code — use 123456 for the demo'); return; }
    state.user = { name: 'Demo User', phone: el.dataset.phone };
    localStorage.setItem('nz_user', JSON.stringify(state.user));
    closeModal();
    toast('Signed in successfully');
    route();
    return;
  }
  if (act === 'demo-login') {
    state.user = { name: 'Demo User', phone: '+260 97 000 0000' };
    localStorage.setItem('nz_user', JSON.stringify(state.user));
    toast('Signed in as demo user');
    route();
    return;
  }
  if (act === 'logout') {
    state.user = null;
    localStorage.removeItem('nz_user');
    toast('Signed out');
    route();
    return;
  }
  if (act === 'verify-agent') { toast('Verification application started — upload your ZIEA licence to continue'); return; }

  /* --- post flow --- */
  if (act === 'd-chip') {
    const g = el.dataset.group, v = el.dataset.val;
    const d = state.draft;
    if (['purpose'].includes(g)) {
      d[g] = v;
    } else {
      const arr = d[g];
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else arr.push(v);
    }
    el.classList.toggle('on');
    saveDraft();
    return;
  }
  if (act === 'd-type') {
    state.draft.type = el.dataset.val;
    $$('.type-opt').forEach(b => b.classList.toggle('on', b.dataset.val === el.dataset.val));
    saveDraft();
    return;
  }
  if (act === 'd-gated') {
    state.draft.gated = el.dataset.val === '1';
    $$('[data-act="d-gated"]').forEach(b => b.classList.toggle('on', b.dataset.val === el.dataset.val));
    saveDraft();
    return;
  }
  if (act === 'd-select') {
    const g = el.dataset.group;
    state.draft[g] = el.value;
    if (g === 'province') state.draft.city = '';
    saveDraft();
    if (g === 'province' || g === 'currency') rerenderStep();
    return;
  }
  if (act === 'rm-photo') {
    state.draft.photos.splice(Number(el.dataset.idx), 1);
    saveDraft();
    rerenderStep();
    return;
  }
  if (act === 'save-draft') { saveDraft(); toast('Draft saved to this device'); return; }
  if (act === 'prev-step') {
    state.postStep = Math.max(1, state.postStep - 1);
    saveDraft();
    route();
    return;
  }
  if (act === 'next-step') {
    const step = state.postStep;
    const err = validateStep(step);
    if (err) {
      toast(err);
      return;
    }
    if (step === POST_STEPS.length) {
      // publish
      const d = state.draft;
      state.myListings.unshift({
        id: 'mine-' + Date.now(),
        title: d.title,
        suburb: d.suburb, city: d.city,
        photos: d.photos.length ? d.photos : [PH.h1],
        status: 'Under review',
        views: 0, enquiries: 0
      });
      localStorage.setItem('nz_mine', JSON.stringify(state.myListings));
      localStorage.removeItem('nz_draft');
      state.draft = null;
      state.postStep = 1;
      openModal(`
        <div style="text-align:center;padding:8px 0 4px">
          <div style="width:60px;height:60px;border-radius:50%;background:var(--green-50);display:grid;place-items:center;margin:0 auto 15px">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#0b6b4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg>
          </div>
          <h3 style="margin-bottom:7px">Listing submitted</h3>
          <p class="sub">Your property is now <b>Under review</b>. Our team usually approves listings within 24 hours, and we'll notify you by SMS and email.</p>
          <a href="#/account" class="btn btn-primary btn-block" data-act="close-modal">Go to my dashboard</a>
        </div>
      `);
      return;
    }
    state.postStep = step + 1;
    saveDraft();
    route();
    return;
  }
});

/* live input capture for the post form (no re-render) */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act="d-input"]');
  if (el && state.draft) {
    state.draft[el.dataset.group] = el.value;
    saveDraft();
  }
});

/* ============================================================
   13. BOOT
   ============================================================ */
if (!location.hash) location.hash = '#/';
route();
</script>
